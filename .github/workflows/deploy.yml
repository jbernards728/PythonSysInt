name: Deploy Project

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Windows app
        run: python -m PyInstaller --clean --noconfirm network_intel_gui.spec

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: network-intel-gui-windows
          path: dist/network_intel_gui.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run tests and build Linux app
        run: |
          .venv/bin/python -m pytest -v
          .venv/bin/python -m PyInstaller --clean --noconfirm network_intel_gui.spec

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: network-intel-gui-linux
          path: dist/network_intel_gui
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/network-intel-gui-windows/network_intel_gui.exe
            release/network-intel-gui-linux/network_intel_gui