name: Automated Testing Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master, DesignGUI ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax across scripts
        run: |
          python -m py_compile network_intel.py ip_lookup.py network_intel_gui.py

      - name: Run automated unit tests with pytest
        run: |
          PYTHONPATH=. pytest -v

